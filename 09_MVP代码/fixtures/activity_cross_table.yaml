# 第三套配置：带外部表（道具表）
# 解决的问题：真实配置表里，活动表只存道具 ID，名字/堆叠/售价在另一张道具表上。
# 引用写成 items.10086.name —— 第一段是表名，第二段是行 id，第三段是字段。
# 表可以多张（items / drops / shop…），sheet 名就是表名。

_meta:
  pack_id: PACK_PLACEMENT_ACTIVITY_CROSS
  name: 放置类 / 兑换商店（跨表）
  version: "0.1"
  note: 用来验证跨表引用：改道具表里的名字，应该只影响引用它的浮窗，不影响邮件

activity:
  id: ACT-1110-02
  name: 霜月祭·兑换商店
  type: 固定循环活动
  server_open_days: 60
  open_day_min: 30
  duration_days: 7
  server_population: 800

tiers:
  - id: T_HIGH
    name: 高档
    ratio: 100
    count: 1
    count_mode: fixed
    item_id: "10087"
  - id: T_MID
    name: 中档
    ratio: 10
    count: 4
    declared_count: 4
    count_mode: fixed
    item_id: "10086"
    quota_pct_min: 0.003
    quota_pct_max: 0.006
  - id: T_LOW
    name: 低档
    ratio: 1
    count: 80
    count_mode: ratio_of_population
    population_ratio: 0.1
    item_id: "10086"

# 跨表链接：drops.item_id 的值是 items 表的行 id。
# 之后就能写 drops.5001.item.name ——「5001 这个掉落组绑定的道具叫什么」。
links:
  - from: drops.item_id
    to: items

tables:
  drops:
    - id: "5001"
      name: 常规掉落组
      item_id: "10086"
      weight: 30
    - id: "5002"
      name: 头奖掉落组
      item_id: "10087"
      weight: 5
  items:
    - id: "10086"
      name: 霜月结晶
      max_stack: 999
      sell_price: 10
    - id: "10087"
      name: 霜月徽记
      max_stack: 99
      sell_price: 50

downstream:
  - id: OBJ_TOOLTIP
    name: 道具浮窗（名称 / 堆叠）
    type: UI
    owner: 客户端
    refs:
      - items.10086.name
      - items.10086.max_stack
  - id: OBJ_SHOP
    name: 商店兑换价
    type: 数值 / 兑换
    owner: 数值策划
    refs:
      - tiers.T_MID.item_id
      - items.10086.sell_price
  - id: OBJ_MAIL
    name: 发奖邮件模板
    type: 文案 / 发放
    owner: 运营
    refs:
      - tiers.T_MID.count
      - items.10087.name
  - id: OBJ_DROP_PREVIEW
    name: 掉落预览面板
    type: UI
    owner: 客户端
    refs:
      - drops.5001.item.name
      - drops.5001.weight
  - id: OBJ_ICON
    name: 头奖展示图
    type: 素材
    owner: 美术
    refs:
      - items.10087.name

derived:
  - path: tiers.T_LOW.count
    formula: round(activity.server_population * tiers.T_LOW.population_ratio)
    refs:
      - activity.server_population
      - tiers.T_LOW.population_ratio
    reason: 低档份数按人数比例推导
