<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Q013 条件可满足性 · 可视化</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --line:#2a3441; --text:#e6edf3;
    --muted:#8b98a8; --sat:#3fb950; --unsat:#f85149; --unk:#d29922;
    --accent:#5b8ff9; --node:#1f2937;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"微软雅黑","Microsoft YaHei",system-ui,sans-serif;font-size:14px}
  header{padding:18px 24px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:12px;line-height:1.7}
  .wrap{display:flex;gap:18px;padding:18px 24px 28px;align-items:flex-start;flex-wrap:wrap}
  .left{flex:1 1 520px;min-width:420px}
  .right{flex:0 0 320px;min-width:300px}
  .tabs{display:flex;gap:8px;margin-bottom:13px;flex-wrap:wrap}
  .tab{padding:7px 13px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
       color:var(--muted);cursor:pointer;font-size:12.5px;transition:.15s}
  .tab:hover{border-color:#3d4b5c;color:var(--text)}
  .tab.on{background:#1d2a3d;border-color:var(--accent);color:#cfe0ff}
  .canvas{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px}
  svg{display:block;width:100%;height:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 16px}
  .card+.card{margin-top:13px}
  .badge{display:inline-block;padding:5px 13px;border-radius:6px;font-weight:700;
         font-size:14px;letter-spacing:.6px}
  .b-SAT{background:rgba(63,185,80,.14);color:var(--sat);border:1px solid rgba(63,185,80,.4)}
  .b-UNSAT{background:rgba(248,81,73,.14);color:var(--unsat);border:1px solid rgba(248,81,73,.4)}
  .b-UNKNOWN{background:rgba(210,153,34,.14);color:var(--unk);border:1px solid rgba(210,153,34,.4)}
  .k{color:var(--muted);font-size:12px;margin:11px 0 4px}
  .v{font-size:13px;line-height:1.75;word-break:break-all}
  .path{color:#9ecbff;font-size:13px}
  .warn{color:var(--unk)}
  code{background:#0b0f14;padding:1px 6px;border-radius:4px;font-size:12.5px;
       font-family:Consolas,monospace;color:#a5d6ff}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px;color:var(--muted);font-size:11.5px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
  footer{padding:0 24px 26px;color:var(--muted);font-size:11.5px;line-height:1.9;
         border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>Q013 任务路径条件可满足性 · 三态判定</h1>
  <div class="sub">对应立项文档 12.5 两层校验：第一层图可达，第二层条件可满足。点上面的用例切换。</div>
</header>

<div class="wrap">
  <div class="left">
    <div class="tabs" id="tabs"></div>
    <div class="canvas"><svg id="svg" viewBox="0 0 720 330"></svg></div>
    <div class="legend">
      <span><i style="background:#3fb950"></i>可达</span>
      <span><i style="background:#5b8ff9"></i>目标节点</span>
      <span><i style="background:#f85149"></i>阻断边</span>
      <span><i style="background:#39424e"></i>未访问</span>
    </div>
  </div>

  <div class="right">
    <div class="card">
      <div id="badge" class="badge b-SAT">SAT</div>
      <div class="k">判定说明</div>
      <div class="v" id="reason"></div>
      <div class="k">探索状态数</div>
      <div class="v" id="states"></div>
    </div>
    <div class="card">
      <div class="k" style="margin-top:0">路径 / 阻断</div>
      <div class="v" id="detail"></div>
    </div>
  </div>
</div>

<footer>
  判定逻辑与 <code>q013_minimal.py</code> 同构：变量必须声明定义域，越界视为非法转移；一条边可含多个原子动作；
  搜索状态上限固定，触顶返回 UNKNOWN——<span class="warn">UNKNOWN 不等于通过</span>。
</footer>

<script>
/* ---------- 用例数据（与 Python 版一一对应） ---------- */
const CASES = [
  {
    name:"用例1 存在合法路径", expect:"SAT",
    vars:{ clue_count:{min:0,max:3,init:0}, secret_revealed:{init:false}, player_trust:{min:0,max:5,init:1} },
    nodes:[
      {id:"start", x:80,  y:165, label:"start"},
      {id:"n1",    x:260, y:165, label:"n1"},
      {id:"n2",    x:440, y:165, label:"n2"},
      {id:"hidden_end", x:630, y:165, label:"hidden_end", target:true}
    ],
    edges:[
      {from:"start", to:"n1", act:"clue_count += 1", x1:80,y1:165,x2:260,y2:165, lx:170,ly:148},
      {from:"n1", to:"n2", act:"clue_count += 1", x1:260,y1:165,x2:440,y2:165, lx:350,ly:148},
      {from:"n2", to:"hidden_end", cond:"clue_count>=2 ∧ ¬secret_revealed ∧ player_trust>=1",
       x1:440,y1:165,x2:630,y2:165, lx:535,ly:148}
    ],
    start:"start", targets:["hidden_end"], limit:50000
  },
  {
    name:"用例2 条件不可满足", expect:"UNSAT",
    vars:{ clue_count:{min:0,max:1,init:0}, secret_revealed:{init:false}, player_trust:{min:0,max:5,init:1} },
    nodes:[
      {id:"start", x:80,  y:165, label:"start"},
      {id:"n1",    x:260, y:165, label:"n1"},
      {id:"n2",    x:440, y:165, label:"n2"},
      {id:"hidden_end", x:630, y:165, label:"hidden_end", target:true}
    ],
    edges:[
      {from:"start", to:"n1", act:"clue_count += 1", x1:80,y1:165,x2:260,y2:165, lx:170,ly:148},
      {from:"n1", to:"n2", act:"clue_count += 1（上限 1，越界）", x1:260,y1:165,x2:440,y2:165, lx:350,ly:140},
      {from:"n2", to:"hidden_end", cond:"clue_count>=2 ∧ ¬secret_revealed",
       x1:440,y1:165,x2:630,y2:165, lx:535,ly:148, key:true}
    ],
    start:"start", targets:["hidden_end"], limit:50000
  },
  {
    name:"用例3 触发搜索上限", expect:"UNKNOWN",
    vars:{ a:{min:0,max:30,init:0}, b:{min:0,max:30,init:0}, c:{min:0,max:30,init:0} },
    nodes:[
      {id:"s", x:70, y:165, label:"s"},
      {id:"p", x:250, y:165, label:"p"},
      {id:"inc_a", x:450, y:65,  label:"inc_a"},
      {id:"inc_b", x:450, y:165, label:"inc_b"},
      {id:"inc_c", x:450, y:265, label:"inc_c"},
      {id:"end", x:640, y:165, label:"end", target:true}
    ],
    edges:[
      {from:"s", to:"p", act:"", x1:70,y1:165,x2:250,y2:165, lx:160,ly:148},
      {from:"p", to:"inc_a", act:"a += 3", x1:250,y1:165,x2:450,y2:65,  lx:330,ly:100},
      {from:"p", to:"inc_b", act:"b += 2", x1:250,y1:165,x2:450,y2:165, lx:350,ly:148},
      {from:"p", to:"inc_c", act:"c += 1", x1:250,y1:165,x2:450,y2:265, lx:330,ly:230},
      {from:"inc_a", to:"p", act:"", x1:450,y1:65,x2:250,y2:165, lx:330,ly:52, back:true},
      {from:"inc_b", to:"p", act:"", x1:450,y1:165,x2:250,y2:165, lx:350,ly:196, back:true},
      {from:"inc_c", to:"p", act:"", x1:450,y1:265,x2:250,y2:165, lx:330,ly:278, back:true},
      {from:"p", to:"end", cond:"a>1000（永不可达）", x1:250,y1:165,x2:640,y2:165, lx:430,ly:120, dashed:true}
    ],
    start:"s", targets:["end"], limit:200
  },
  {
    name:"用例4 单边多变量变更", expect:"SAT",
    vars:{ clue_count:{min:0,max:3,init:0}, player_trust:{min:0,max:5,init:1}, secret_revealed:{init:false} },
    nodes:[
      {id:"start", x:90,  y:165, label:"start"},
      {id:"n1",    x:340, y:165, label:"n1"},
      {id:"end",   x:610, y:165, label:"end", target:true}
    ],
    edges:[
      {from:"start", to:"n1", act:"clue_count += 1 且 player_trust += 2", x1:90,y1:165,x2:340,y2:165, lx:215,ly:140},
      {from:"n1", to:"end", cond:"clue_count>=1 ∧ player_trust>=3 ∧ ¬secret_revealed", x1:340,y1:165,x2:610,y2:165, lx:475,ly:148}
    ],
    start:"start", targets:["end"], limit:50000
  }
];

/* ---------- 判定引擎（与 Python 版同构） ---------- */
function check(c){
  const names = Object.keys(c.vars);
  const init = names.map(n=>[n, c.vars[n].init]);
  const key = st => st.map(p=>p[0]+"="+String(p[1])).join("|");
  const env = st => { const o={}; st.forEach(p=>o[p[0]]=p[1]); return o; };

  const stack = [[c.start, init, [c.start]]];
  const visited = new Set();
  const reachable = new Set([c.start]);
  let explored = 0, hit = false;
  const usedEdges = new Set();
  const maxSeen = {}; names.forEach(n=>maxSeen[n]=c.vars[n].init);

  while(stack.length){
    const [node, state, path] = stack.pop();
    const k = node+"#"+key(state);
    if(visited.has(k)) continue;
    visited.add(k); explored++;

    const e = env(state);
    names.forEach(n=>{ if(typeof e[n]==="number") maxSeen[n]=Math.max(maxSeen[n], e[n]); });

    if(c.targets.includes(node)){
      const pathEdges = new Set();
      for(let i=0;i<path.length-1;i++){
        const e2 = c.edges.find(x=>x.from===path[i] && x.to===path[i+1]);
        if(e2) pathEdges.add(e2);
      }
      return {result:"SAT", path, finalState:e, explored, reachable,
              usedEdges:pathEdges};
    }
    if(explored > c.limit){ hit = true; break; }

    for(const ed of c.edges.filter(x=>x.from===node)){
      if(ed.__ok && !ed.__ok(e)) continue;     // 无效边（本 demo 不用）
      // 条件求值
      let ok = true;
      try{ ok = ed.cond ? ed.cond.fn(e) : true; }catch(_){ ok = false; }
      if(!ok) continue;

      // 应用动作
      let bad = false;
      const ns = state.map(p=>[p[0],p[1]]);
      const setV=(k2,v)=>{ const i=ns.findIndex(p=>p[0]===k2); if(i>=0) ns[i]=[k2,v]; else ns.push([k2,v]); };
      const getV=k2=>{ const f=ns.find(p=>p[0]===k2); return f?f[1]:0; };
      for(const a of (ed.actions||[])){
        let v = getV(a.v);
        if(a.op==="set") v = a.value;
        else if(a.op==="+=") v = v + a.value;
        else if(a.op==="-=") v = v - a.value;
        const spec = c.vars[a.v] || {};
        if(spec.max !== undefined && (v > spec.max || v < spec.min)) { bad = true; break; }
        setV(a.v, v);
      }
      if(bad) continue;
      usedEdges.add(ed);
      reachable.add(ed.to);
      stack.push([ed.to, ns, path.concat([ed.to])]);
    }
  }

  if(hit) return {result:"UNKNOWN", explored, maxSeen, reachable, usedEdges,
                  reason:`状态数超过上限 ${c.limit}，无法穷尽`};

  const blocking = c.edges.filter(ed=>c.targets.includes(ed.to) && !usedEdges.has(ed));
  return {result:"UNSAT", explored, maxSeen, reachable, usedEdges, blocking,
          reason:"穷尽所有可达状态，目标节点不可达"};
}

/* ---------- 把条件字符串转成函数 ---------- */
function prep(c){
  const map = {
    "clue_count>=2 ∧ ¬secret_revealed ∧ trust>=1": e=> e.clue_count>=2 && !e.secret_revealed && e.player_trust>=1,
    "clue_count>=2 ∧ ¬secret_revealed":            e=> e.clue_count>=2 && !e.secret_revealed,
    "a>1000（永不可达）":                          e=> e.a>1000,
    "clue_count>=1 ∧ player_trust>=3 ∧ ¬secret_revealed": e=> e.clue_count>=1 && e.player_trust>=3 && !e.secret_revealed
  };
  c.edges.forEach(ed=>{
    if(ed.cond){ ed.cond = {text:ed.cond, fn: map[ed.cond] || (()=>true)}; }
    if(ed.act && ed.act.includes("+=")){
      // 从 act 文本解析动作
      const acts = [];
      if(ed.act.includes("clue_count += 1 且")) acts.push({v:"clue_count",op:"+=",value:1},{v:"player_trust",op:"+=",value:2});
      else{
        const m = ed.act.match(/^(\w+) \+= (\d+)/);
        if(m) acts.push({v:m[1], op:"+=", value:parseInt(m[2])});
      }
      ed.actions = acts;
    } else ed.actions = [];
  });
  return c;
}

/* ---------- 渲染 ---------- */
const NS="http://www.w3.org/2000/svg";
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}

/* 标签过长时折行，避免压到节点和相邻标签 */
function wrapLabel(txt){
  if(txt.length<=16) return [txt];
  if(txt.includes("（")){
    const i=txt.indexOf("（");
    return [txt.slice(0,i).trim(), txt.slice(i).trim()];
  }
  if(txt.includes("∧")){
    return txt.split("∧").map(t=>t.trim()).slice(0,3);
  }
  if(txt.includes("且")){
    return txt.split("且").map(t=>t.trim()).slice(0,2);
  }
  return [txt.slice(0,15)+"…"];
}

function draw(idx){
  const c = prep(JSON.parse(JSON.stringify(CASES[idx], (k,v)=> typeof v==="function"?undefined:v)));
  const res = check(c);
  const svg = document.getElementById("svg");
  svg.innerHTML = "";

  // 边
  c.edges.forEach(ed=>{
    const blocked = res.result==="UNSAT" && res.blocking && res.blocking.some(b=>b.from===ed.from&&b.to===ed.to);
    const isBack = ed.back;
    const color = blocked ? "#f85149" : (res.usedEdges && res.usedEdges.has(ed) ? "#3f6f47" : "#39424e");
    const l = el("line",{x1:ed.x1,y1:ed.y1,x2:ed.x2,y2:ed.y2,stroke:color});
    l.setAttribute("stroke-width", blocked?2.4:1.6);
    if(blocked||ed.dashed) l.setAttribute("stroke-dasharray","6 4");
    if(isBack) l.setAttribute("opacity","0.55");
    svg.appendChild(l);

    // 箭头
    const ang = Math.atan2(ed.y2-ed.y1, ed.x2-ed.x1);
    const tipX = ed.x2 - 34*Math.cos(ang), tipY = ed.y2 - 34*Math.sin(ang);
    const p = el("polygon",{
      points:`${tipX},${tipY} ${tipX-9*Math.cos(ang-0.4)},${tipY-9*Math.sin(ang-0.4)} ${tipX-9*Math.cos(ang+0.4)},${tipY-9*Math.sin(ang+0.4)}`,
      fill:color});
    svg.appendChild(p);

    const txt = ed.cond ? ed.cond.text : (ed.act||"");
    if(txt){
      const lines = wrapLabel(txt);
      const lh = 12.5;
      const top = ed.ly - 10 - (lines.length-1)*lh;   /* 多行时整体上移，留出节点间距 */
      const wMax = Math.max(...lines.map(l=>l.length))*6.3 + 12;

      /* 底衬：压住网格和连线，保证可读 */
      const bg = el("rect",{x:ed.lx-wMax/2, y:top-11, width:wMax, height:lines.length*lh+6,
        rx:3, fill:"#0e1319", opacity:"0.92"});
      svg.appendChild(bg);

      lines.forEach((ln,k)=>{
        const t = el("text",{x:ed.lx, y:top+k*lh, fill: blocked?"#ff7b72":"#9aa7b8",
          "font-size":"10","text-anchor":"middle","font-family":"Consolas,monospace"});
        t.textContent = ln;
        svg.appendChild(t);
      });
    }
  });

  // 节点
  c.nodes.forEach(n=>{
    const isTarget = n.target;
    const reached = res.reachable.has(n.id);
    let fill="#1f2937", stroke="#39424e", tcolor="#8b98a8";
    if(isTarget){ fill="#16243a"; stroke="#5b8ff9"; tcolor="#9ecbff"; }
    if(reached && !isTarget){ fill="#13251a"; stroke="#3fb950"; tcolor="#7ee787"; }
    const g = el("g",{});
    g.appendChild(el("rect",{x:n.x-34,y:n.y-17,width:68,height:34,rx:8,
      fill, stroke, "stroke-width":isTarget?2:1.4}));
    const t = el("text",{x:n.x,y:n.y+4,fill:tcolor,"font-size":"11.5",
      "text-anchor":"middle","font-family":"Consolas,monospace"});
    t.textContent = n.label;
    g.appendChild(t);
    svg.appendChild(g);
  });

  // 结果面板
  const badge = document.getElementById("badge");
  badge.textContent = res.result;
  badge.className = "badge b-"+res.result;

  document.getElementById("reason").textContent =
    res.result==="SAT" ? "存在一条可触发的路径，所有条件同时成立。"
    : res.result==="UNSAT" ? (res.reason + "（阻断原因见右）")
    : res.reason;

  document.getElementById("states").textContent = res.explored + " 个状态";

  const d = document.getElementById("detail");
  if(res.result==="SAT"){
    d.innerHTML = '<div class="path">' + res.path.join(" → ") + '</div>'
      + '<div class="k">终态</div><div class="v">'
      + Object.entries(res.finalState).map(([k,v])=>k+"="+v).join("　") + '</div>';
  } else if(res.result==="UNSAT"){
    const b = res.blocking||[];
    d.innerHTML = b.map(x=>
      '<div class="v" style="color:#f85149">阻断边：' + x.from + ' → ' + x.to + '</div>'
      + '<div class="k">条件</div><div class="v"><code>' + x.cond.text + '</code></div>'
    ).join("") + '<div class="k">各变量观测到的最大值</div><div class="v">'
      + Object.entries(res.maxSeen).map(([k,v])=>k+"="+v).join("　") + '</div>';
  } else {
    d.innerHTML = '<div class="v warn">搜索被截断，未得到结论。</div>'
      + '<div class="k">触顶时观测到的最大值</div><div class="v">'
      + Object.entries(res.maxSeen).map(([k,v])=>k+"="+v).join("　") + '</div>'
      + '<div class="k">提示</div><div class="v">收窄变量定义域或提高上限后重跑；'
      + '该结果不允许当成通过。</div>';
  }

  // tab 状态
  [...document.querySelectorAll(".tab")].forEach((t,i)=>t.classList.toggle("on", i===idx));
}

/* ---------- tab ---------- */
const tabs = document.getElementById("tabs");
CASES.forEach((c,i)=>{
  const b = document.createElement("div");
  b.className = "tab";
  b.textContent = c.name;
  b.onclick = ()=>draw(i);
  tabs.appendChild(b);
});
draw(0);
</script>
</body>
</html>
